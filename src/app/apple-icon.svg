<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="appleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C2C2C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1A1A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners for Apple touch icon -->
  <rect width="100" height="100" rx="20" fill="url(#appleGradient)" stroke="#D4AF37" stroke-width="2"/>
  
  <!-- Elegant serif "B" -->
  <text x="50" y="70" font-family="Georgia, serif" font-size="60" font-weight="bold" fill="#D4AF37" text-anchor="middle">B</text>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="15" r="1.5" fill="#D4AF37"/>
  <circle cx="50" cy="85" r="1.5" fill="#D4AF37"/>
</svg>
